        // --- 5. GENERATING UNIQUE TICKET NUMBERS WITH CAPITAL PREFIX (KL) ---
        const ticketsGrid = document.getElementById('tickets-grid');
        let selectedTickets = [];
        const ticketPrice = 149;

        for (let i = 1; i <= 200; i++) {
            const randomDigits = Math.floor(100000 + Math.random() * 900000);
            const ticketID = `KL${randomDigits}`;
            
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'border-2 border-dashed border-slate-300 text-slate-700 font-bold p-2 rounded-xl text-center hover:bg-slate-100 transition text-sm flex items-center justify-center gap-1';
            btn.innerHTML = `🎫 <span>${ticketID}</span>`;
            
            btn.onclick = function() {
                const index = selectedTickets.indexOf(ticketID);
                if (index > -1) {
                    selectedTickets.splice(index, 1);
                    this.className = 'border-2 border-dashed border-slate-300 text-slate-700 font-bold p-2 rounded-xl text-center hover:bg-slate-100 transition text-sm flex items-center justify-center gap-1';

                    selectedTickets.push(ticketID);
                    this.className = 'bg-slate-800 text-amber-400 font-bold p-2 rounded-xl text-center border-2 border-solid border-slate-800 transition text-sm flex items-center justify-center gap-1';
                }
                document.getElementById('ticketCount').innerText = selectedTickets.length;
                document.getElementById('totalAmount').innerText = `₹${selectedTickets.length * ticketPrice}`;
            };
            ticketsGrid.appendChild(btn);
        }

        function submitBooking() {
            const rawName = document.getElementById('fullName').value || "rakesh kumar";
            const userWhatsapp = document.getElementById('whatsappNum').value || "8292439299";
            const totalAmount = selectedTickets.length * ticketPrice;

            const message = `*NEW KERALA LOTTERY BOOKING*\n\n*🎉 Booking Successful 🎉*\n\n👤 *Name: ${italicName}*\n\n📞 *WhatsApp:* *${userWhatsapp}*\n\n🎟️ *Selected Tickets (${selectedTickets.length}):*\n*${selectedTickets.join(', ')}*\n\n💰 *Total Amount:* *₹${totalAmount}*\n\n*You will pay now ticket price ${totalAmount}*`;

            window.location.href = `https://api.whatsapp.com/send?phone=91${myWhatsappNumber}&text=${encodedMessage}`;
